<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <h1>Dice Roller</h1>
        <div class="divider"></div>

        <div class="mode-toggle">
            <button id="mode-simple-btn" class="mode-btn active">Simple</button>
            <button id="mode-command-btn" class="mode-btn">Command</button>
        </div>

        <div class="size-row">
            <span class="size-label">Dice size</span>
            <div class="size-controls">
                <button id="dice-size-dec" class="size-btn" type="button">&minus;</button>
                <span class="size-value" id="dice-size-value">2.4</span>
                <button id="dice-size-inc" class="size-btn" type="button">+</button>
            </div>
        </div>

        <div class="controls">
            <label for="dice-count">Dice count</label>
            <input type="number" id="dice-count" min="1" max="15" value="2">
        </div>

        <div class="command-section hidden">
            <label for="command-input">Command</label>
            <input type="text" id="command-input" placeholder="3d6>=5" spellcheck="false" autocomplete="off">
            <div class="operator-row">
                <button type="button" class="op-btn" data-insert="d6">D6</button>
                <button type="button" class="op-btn" data-insert=">">&gt;</button>
                <button type="button" class="op-btn" data-insert="<">&lt;</button>
                <button type="button" class="op-btn" data-insert="=">=</button>
            </div>
            <div class="command-hint">3d6 &middot; 2d6&gt;4 &middot; d6&gt;=5</div>
        </div>

        <div class="btn-row">
            <button id="roll-btn" class="btn-roll">Roll</button>
            <button id="reset-btn" class="btn-reset">Reset</button>
        </div>

        <div class="divider"></div>

        <details class="settings-panel">
            <summary class="settings-toggle">View settings</summary>
            <div class="settings-content">

                <div class="setting-row">
                    <span class="setting-label">Shadows</span>
                    <input type="checkbox" id="setting-shadows" checked>
                </div>

                <div class="setting-row">
                    <span class="setting-label">Shadow quality</span>
                    <select id="setting-shadow-quality">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high" selected>High</option>
                    </select>
                </div>

                <div class="setting-row">
                    <span class="setting-label">Elevation</span>
                    <span class="setting-value" id="val-elevation">0&deg;</span>
                </div>
                <input type="range" id="setting-elevation" min="0" max="75" value="0" step="1">

                <div class="setting-row">
                    <span class="setting-label">Distance</span>
                    <span class="setting-value" id="val-distance">30</span>
                </div>
                <input type="range" id="setting-distance" min="15" max="60" value="30" step="1">

                <div class="setting-row">
                    <span class="setting-label">Rotation</span>
                    <span class="setting-value" id="val-rotation">0&deg;</span>
                </div>
                <input type="range" id="setting-rotation" min="0" max="360" value="0" step="1">

                <div class="setting-row">
                    <span class="setting-label">Ambient light</span>
                    <span class="setting-value" id="val-ambient">0.5</span>
                </div>
                <input type="range" id="setting-ambient" min="0" max="2" value="0.5" step="0.1">

                <div class="setting-row">
                    <span class="setting-label">Direct light</span>
                    <span class="setting-value" id="val-directional">0.8</span>
                </div>
                <input type="range" id="setting-directional" min="0" max="2" value="0.8" step="0.1">

            </div>
        </details>

        <div class="divider"></div>

        <div class="history-header">
            <span class="history-title">History</span>
            <button id="clear-history" class="history-clear">clear</button>
        </div>
        <div id="history" class="history-list">
            <div class="empty-history">No rolls yet</div>
        </div>
    </aside>

    <main class="main">
        <div id="canvas-container"></div>
        <div id="result" class="result-bar"></div>
    </main>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
